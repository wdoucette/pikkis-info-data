name: Check local Love Nikki catalogue

on:
  schedule:
    # Daily 18:23 UTC: 10:23 Vancouver winter / 11:23 summer.
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      update_ready:
        description: 'I have opened the game and completed all required downloads. Build a candidate.'
        type: boolean
        default: false
      publish_snapshot:
        description: 'Optional: reviewed snapshot ID from a prior candidate report. Creates a data-update PR.'
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: powershell

concurrency:
  group: local-emulator-catalogue
  cancel-in-progress: false

jobs:
  capture:
    # Never execute pull-request code on Wayne Home.
    if: github.repository == 'wdoucette/pikkis-info-data' && github.ref == 'refs/heads/main' && inputs.publish_snapshot == ''
    runs-on: [self-hosted, Windows, X64, pikki-bluestacks]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          clean: false # retain local .emulator snapshots between runs
      - name: Use runner's local Python
        shell: powershell
        run: |
          $pythonDir = Join-Path $env:USERPROFILE 'Documents/Codex/Pikki-Runner/Python312'
          if (!(Test-Path (Join-Path $pythonDir 'python.exe'))) { throw 'Install the runner Python described in EMULATOR.md first.' }
          $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install decoder dependencies
        run: python -m pip install -r scripts/emulator/requirements.txt
      - name: Test parser and stable IDs
        run: python -m unittest discover -s tests -v
      - name: Open game and capture installed catalogue
        id: check
        shell: powershell
        run: |
          python -X utf8 scripts/emulator_update.py check --launch
          $checkExit = $LASTEXITCODE
          if ($checkExit -notin 0, 10) { exit $checkExit }
          $status = Get-Content .emulator/status.json -Raw | ConvertFrom-Json
          "changed=$($status.changed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "snapshot=$($status.snapshot)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "## Local catalogue check`n$($status.message)`nCatalogue hash: $($status.catalogue_hash)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          exit 0
      - name: Build candidate after game update confirmation
        if: inputs.update_ready && steps.check.outputs.changed == 'true'
        env:
          SNAPSHOT: ${{ steps.check.outputs.snapshot }}
        run: python -X utf8 scripts/emulator_update.py build --snapshot "$env:SNAPSHOT" --ready
      - name: Upload catalogue candidate and change report
        if: inputs.update_ready && steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: emulator-catalogue-candidate
          path: ${{ steps.check.outputs.snapshot }}/candidate/
          retention-days: 14
      - name: Flag attention required
        if: steps.check.outputs.changed == 'true' && !inputs.update_ready
        run: |
          Write-Output '::error::Catalogue differs. Finish any game update, then Run workflow with update_ready checked. No published data was changed.'
          exit 1

  propose-reviewed-update:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'wdoucette/pikkis-info-data' && github.ref == 'refs/heads/main' && inputs.publish_snapshot != ''
    runs-on: [self-hosted, Windows, X64, pikki-bluestacks]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: false
      - name: Use runner's local Python
        shell: powershell
        run: |
          $pythonDir = Join-Path $env:USERPROFILE 'Documents/Codex/Pikki-Runner/Python312'
          if (!(Test-Path (Join-Path $pythonDir 'python.exe'))) { throw 'Install the runner Python described in EMULATOR.md first.' }
          $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Stage reviewed candidate and open a pull request
        env:
          SNAPSHOT_ID: ${{ inputs.publish_snapshot }}
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          if ($env:SNAPSHOT_ID -notmatch '^\d{8}T\d{12}Z$') { throw 'Invalid snapshot ID' }
          $candidate = Join-Path '.emulator/snapshots' "$env:SNAPSHOT_ID/candidate"
          $branch = "catalogue/emulator-$env:GITHUB_RUN_ID"
          git switch -c $branch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 scripts/emulator_update.py publish --candidate $candidate --reviewed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git add data/pikkis-info.min.json data/version.json data/game-id-map.json data/overrides.csv
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Output 'No content changes.'; exit 0 }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update catalogue from local Love Nikki installation'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git push origin $branch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $report = Get-Content "$candidate/report.json" -Raw | ConvertFrom-Json
          $body = @{title='Update catalogue from local Love Nikki installation'; head=$branch; base='main'; body="Extracted locally after the operator confirmed the game update was complete. Preserves stable wardrobe IDs and applies editorial overrides.`n`nItems: $($report.items); new: $($report.new_items). Catalogue hash: $($report.snapshot_hash). See the prior candidate artifact for the field-level change report."} | ConvertTo-Json
          $pr = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/pulls" -Headers @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'} -Body $body -ContentType 'application/json'
          "Review and merge: $($pr.html_url)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
